<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1722">
<link rel="manifest" href="manifest.webmanifest">
<title>Avatar</title>
<style>
  :root { --encre: #0F1722; --encre2: #1A2433; --encre3: #2B374A; --papier: #E9EDF2; --gris: #B2B8BE; --ambre: #E8A33D; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--encre); color: var(--papier); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 16px; }
  .ecran { display: none; height: 100dvh; flex-direction: column; max-width: 560px; margin: 0 auto; padding-top: env(safe-area-inset-top); }
  .ecran.actif { display: flex; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--encre3); }
  h1 { font-family: Georgia, serif; font-size: 24px; flex: 1; }
  .pastille { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; color: var(--encre); position: relative; }
  .pastille .emo { position: absolute; right: -6px; bottom: -6px; font-size: 18px; background: var(--encre); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; }
  .icone { background: none; border: 0; color: var(--papier); font-size: 26px; cursor: pointer; padding: 4px 8px; min-width: 44px; min-height: 44px; }
  .corps { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
  #liste { display: grid; gap: 12px; }
  .carte { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--encre2); border: 1px solid var(--encre3); border-radius: 16px; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%; }
  .carte:active, .carte:focus-visible { border-color: var(--ambre); outline: none; }
  .carte .nom { font-weight: 600; }
  .carte .lien { color: var(--gris); font-size: 14px; margin-top: 2px; }
  .bandeau { background: var(--encre2); border: 1px solid var(--ambre); border-radius: 12px; padding: 12px 14px; color: var(--papier); font: inherit; text-align: left; width: 100%; cursor: pointer; }
  .bandeau[hidden] { display: none; }
  .note { color: var(--gris); font-size: 13px; padding: 0 16px 16px; }
  #titre { flex: 1; min-width: 0; }
  #titre .nom { font-weight: 600; }
  #titre .etat { color: var(--gris); font-size: 13px; }
  #fil { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bulle { max-width: 80%; padding: 10px 14px; border-radius: 18px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bulle.user { align-self: flex-end; background: var(--ambre); color: var(--encre); border-bottom-right-radius: 4px; }
  .bulle.avatar { align-self: flex-start; background: var(--encre2); border: 1px solid var(--encre3); border-bottom-left-radius: 4px; }
  .bulle.attente { color: var(--gris); font-style: italic; }
  .bulle.erreur { border-color: var(--ambre); color: var(--ambre); }
  #saisie { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--encre3); }
  input, textarea { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--encre3); background: var(--encre2); color: var(--papier); font: inherit; font-size: 16px; width: 100%; }
  #message { border-radius: 24px; }
  input:focus, textarea:focus { outline: none; border-color: var(--ambre); }
  textarea { resize: vertical; line-height: 1.4; }
  label { display: grid; gap: 6px; color: var(--gris); font-size: 14px; }
  .bouton { border: 0; border-radius: 24px; padding: 12px 18px; background: var(--ambre); color: var(--encre); font: inherit; font-weight: 700; cursor: pointer; }
  .bouton:disabled { opacity: .5; }
  .bouton.second { background: var(--encre2); color: var(--papier); border: 1px solid var(--encre3); }
  .rang { display: flex; gap: 8px; flex-wrap: wrap; }
  .pied { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--encre3); }
  .pied .bouton { flex: 1; }
  #f-fiche { min-height: 40dvh; }
  .msg { color: var(--ambre); font-size: 14px; min-height: 1em; }
  h2 { font-family: Georgia, serif; font-size: 18px; margin-top: 8px; }
</style>
</head>
<body>

<section id="ecran-liste" class="ecran actif">
  <header><h1>Mes proches</h1><button class="icone" id="vers-reglages" aria-label="Réglages">⚙</button></header>
  <div class="corps">
    <button id="bandeau" class="bandeau" hidden>Ajoute ta clé Gemini dans Réglages.</button>
    <div id="liste"></div>
  </div>
  <p class="note">Avatars fictifs pour tester l’appli.</p>
</section>

<section id="ecran-chat" class="ecran">
  <header>
    <button class="icone" id="retour" aria-label="Retour à la liste">‹</button>
    <div id="pastille" class="pastille"></div>
    <div id="titre"><div class="nom"></div><div class="etat"></div></div>
    <button class="icone" id="vers-fiche" aria-label="Modifier la fiche">✎</button>
  </header>
  <div id="fil" aria-live="polite"></div>
  <form id="saisie">
    <input id="message" autocomplete="off" placeholder="Écris un message…" aria-label="Message">
    <button class="bouton" id="envoyer" type="submit">Envoyer</button>
  </form>
</section>

<section id="ecran-fiche" class="ecran">
  <header><h1>Fiche</h1></header>
  <div class="corps">
    <label>Nom<input id="f-nom"></label>
    <label>Lien avec toi<input id="f-lien"></label>
    <label>Fiche (texte libre)<textarea id="f-fiche"></textarea></label>
  </div>
  <div class="pied">
    <button class="bouton second" id="fiche-annuler" type="button">Annuler</button>
    <button class="bouton" id="fiche-ok" type="button">Enregistrer</button>
  </div>
</section>

<section id="ecran-reglages" class="ecran">
  <header><h1>Réglages</h1></header>
  <div class="corps">
    <label>Clé Gemini<input id="r-cle" type="password" autocomplete="off"></label>
    <label>Ton prénom<input id="r-prenom"></label>
    <label>Ce que tous savent<textarea id="r-commun" rows="8"></textarea></label>
    <h2>Fiches</h2>
    <div class="rang">
      <button class="bouton second" id="exporter" type="button">Exporter</button>
      <button class="bouton second" id="importer" type="button">Importer</button>
      <input id="fichier" type="file" accept=".json,application/json,text/plain" hidden>
    </div>
    <div class="msg" id="r-msg" role="status"></div>
    <button class="bouton second" id="effacer" type="button">Effacer les conversations</button>
  </div>
  <div class="pied">
    <button class="bouton second" id="reglages-annuler" type="button">Annuler</button>
    <button class="bouton" id="reglages-ok" type="button">Enregistrer</button>
  </div>
</section>

<script type="module" src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
