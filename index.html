<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B5288">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Newsreader:wght@500;600&display=swap">
<title>Avatar Coach</title>
<style>
  /* Thème « ciel et soleil » : clair par défaut, sombre selon le téléphone. */
  :root {
    --barre: #2B5288; --or: #F2C230; --accent: #2F6FDB;
    --fond: #F7F9FC; --carte: #FFFFFF; --bord: #D6DFEC;
    --texte: #3D4F6B; --texte2: #5B6B82; --titre: #2B5288;
    --av-fond: #FFF7DB; --av-texte: #6B5310; --danger: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0E1A2E; --carte: #172640; --bord: #2A3F63;
      --texte: #D5DEEE; --texte2: #9FB0CC; --titre: #EAF0FA;
      --av-fond: #3A3213; --av-texte: #F2DFA0; --danger: #FF8A80;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--fond); color: var(--texte); font-family: Inter, Arial, system-ui, sans-serif; font-size: 16px; }
  .ecran { display: none; height: 100dvh; flex-direction: column; max-width: 520px; margin: 0 auto; background: var(--fond); }
  .ecran.actif { display: flex; }
  header { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; background: var(--barre); border-bottom: 3px solid var(--or); color: #fff; }
  h1 { font-family: Newsreader, Georgia, serif; font-weight: 600; font-size: 24px; flex: 1; color: #fff; }
  h2 { font-family: Newsreader, Georgia, serif; font-weight: 600; font-size: 19px; margin-top: 8px; color: var(--titre); }
  .icone { background: none; border: 0; color: #fff; font-size: 26px; cursor: pointer; padding: 4px 8px; min-width: 44px; min-height: 44px; }
  .corps { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
  .pastille { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; position: relative; }
  .pastille img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .pastille.grande { width: 88px; height: 88px; font-size: 28px; }
  .pastille .emo { position: absolute; right: -6px; bottom: -6px; font-size: 18px; background: var(--barre); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; }

  .avert { background: var(--av-fond); border: 1px solid var(--or); border-radius: 12px; padding: 12px 14px; color: var(--av-texte); font: inherit; font-size: 15px; text-align: left; width: 100%; }
  button.avert { cursor: pointer; }
  .avert[hidden] { display: none; }
  #liste { display: grid; gap: 10px; }
  .carte { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; color: var(--texte); cursor: pointer; width: 100%; }
  .carte:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .carte input[type=checkbox] { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
  .carte .texte { flex: 1; min-width: 0; }
  .carte .nom { font-weight: 600; color: var(--titre); }
  .carte .lien { color: var(--texte2); font-size: 14px; margin-top: 2px; }
  .carte .cerveau { font-size: 16px; }
  .carte .icone { color: var(--accent); font-size: 22px; }
  #chargement-texte { margin: auto; color: var(--texte2); }

  #titre { flex: 1; min-width: 0; }
  #titre .nom { font-weight: 600; }
  #titre .etat { color: #D6E2F5; font-size: 13px; }
  #fil, #conf-fil { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bulle { max-width: 80%; padding: 10px 14px; border-radius: 18px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bulle.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bulle.avatar { align-self: flex-start; background: var(--carte); border: 1px solid var(--bord); border-bottom-left-radius: 4px; }
  .bulle.attente { color: var(--texte2); font-style: italic; }
  .bulle.erreur { background: var(--av-fond); border-color: var(--or); color: var(--av-texte); }
  .souvenir { padding: 6px 16px; font-size: 13px; font-style: italic; color: var(--texte2); background: var(--fond); overflow-wrap: anywhere; }
  .souvenir[hidden] { display: none; }
  .pied.bas { border-top: 0; padding-top: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  #saisie, #conf-saisie { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--bord); background: var(--carte); }

  input, textarea, select { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); font: inherit; font-size: 16px; width: 100%; }
  input[type=checkbox] { flex: none; width: 20px; height: 20px; padding: 0; accent-color: var(--accent); }
  #message, #conf-message { border-radius: 24px; }
  .micro { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--bord); background: var(--carte); font-size: 22px; cursor: pointer; padding: 0; }
  .micro[aria-pressed="true"] { background: var(--or); border-color: var(--or); animation: ecoute 1.2s ease-in-out infinite; }
  @keyframes ecoute { 50% { transform: scale(1.08); } }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  textarea { resize: vertical; line-height: 1.4; }
  label { display: grid; gap: 6px; color: var(--texte2); font-size: 14px; }
  label.case { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--texte); }
  .bouton { border: 0; border-radius: 24px; padding: 12px 18px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px; }
  .bouton:disabled { opacity: .45; cursor: default; }
  .bouton.second { background: var(--carte); color: var(--accent); border: 1px solid var(--bord); }
  .bouton.danger { color: var(--danger); }
  .rang { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .portrait-panel { display: grid; gap: 10px; padding: 12px; background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; }
  .portrait-panel[hidden] { display: none; }
  .portrait-panel .apercu { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; justify-self: center; border: 1px solid var(--bord); }
  .pied { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--bord); background: var(--carte); }
  .pied .bouton { flex: 1; }
  #f-fiche { min-height: 30dvh; }
  .msg { color: var(--av-texte); font-size: 14px; min-height: 1em; }
  @media (prefers-color-scheme: dark) { .msg { color: var(--or); } }
  #souvenirs { list-style: none; padding: 0; display: grid; gap: 8px; }
  #souvenirs li { display: flex; align-items: flex-start; gap: 8px; background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 8px 8px 8px 14px; }
  #souvenirs li span { flex: 1; padding-top: 8px; overflow-wrap: anywhere; }
  #souvenirs .icone { color: var(--texte2); font-size: 22px; }
  .vide { color: var(--texte2); font-size: 14px; }
  #confs { display: grid; gap: 10px; }
  .conf-passee { font: inherit; text-align: left; min-height: 48px; }
  #conf-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 4px; }
  .conf-carte { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; min-width: 0; }
  .conf-carte .pastille { width: 40px; height: 40px; font-size: 14px; }
  .conf-carte .pastille .emo { width: 22px; height: 22px; font-size: 14px; right: -8px; bottom: -8px; }
  .conf-carte .texte { min-width: 0; }
  .conf-carte .nom { font-weight: 600; color: var(--titre); }
  .conf-carte .etat { color: var(--texte2); font-size: 12px; overflow-wrap: anywhere; }
  .conf-carte.parle { border-color: var(--or); box-shadow: 0 0 0 2px var(--or); }
  .conf-carte.erreur { border-color: var(--or); background: var(--av-fond); }
  .conf-carte.erreur .etat { color: var(--av-texte); }
  .bulle .qui { display: block; font-size: 12px; font-weight: 700; color: var(--texte2); margin-bottom: 2px; }
  #conf-fil .bulle { max-width: 88%; }
  #visionneuse { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92); display: grid; place-items: center; cursor: zoom-out; }
  #visionneuse[hidden] { display: none; }
  #visio-img { width: min(96vw, 90vh); aspect-ratio: 1; object-fit: contain; border-radius: 8px; }
  #visio-fermer { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 8px; width: 48px; height: 48px; border: 0; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; font-size: 32px; line-height: 1; cursor: pointer; }
  #alerte { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); pointer-events: none; transform: translateX(-50%); max-width: 480px; width: calc(100% - 32px); z-index: 5; }
</style>
</head>
<body>

<section id="ecran-chargement" class="ecran actif"><p id="chargement-texte">Chargement…</p></section>

<section id="ecran-liste" class="ecran">
  <header><h1>Mon équipe</h1><button class="icone" id="vers-reglages" aria-label="Réglages">⚙</button></header>
  <div class="corps">
    <div class="avert">Coachs, pas des pros. En cas de détresse : 3114 (gratuit, 24 h/24) ou 15.</div>
    <button id="bandeau" class="avert" hidden>Ajoute ta clé Gemini dans Réglages.</button>
    <div id="liste"></div>
    <button class="bouton second" id="ajouter" type="button">+ Ajouter un coach</button>
    <h2 id="confs-titre" hidden>Conférences passées</h2>
    <div id="confs"></div>
  </div>
  <div class="pied">
    <button class="bouton" id="appeler" type="button" disabled>Appeler</button>
    <button class="bouton second" id="conference" type="button" disabled>Conférence</button>
  </div>
</section>

<section id="ecran-chat" class="ecran">
  <header>
    <button class="icone" id="retour" aria-label="Retour à la liste">‹</button>
    <div id="pastille" class="pastille"></div>
    <div id="titre"><div class="nom"></div><div class="etat"></div></div>
    <button class="icone" id="vers-fiche" aria-label="Modifier la fiche">✎</button>
  </header>
  <div id="fil" aria-live="polite"></div>
  <div id="souvenir" class="souvenir" hidden></div>
  <form id="saisie">
    <input id="message" autocomplete="off" placeholder="Écris un message…" aria-label="Message">
    <button class="micro" id="micro" type="button" aria-label="Dicter un message" aria-pressed="false">🎤</button>
    <button class="bouton" id="envoyer" type="submit">Envoyer</button>
  </form>
  <div class="pied bas"><button class="bouton second" id="terminer" type="button">Terminer la séance</button></div>
</section>

<section id="ecran-conference" class="ecran">
  <header>
    <button class="icone" id="conf-retour" aria-label="Retour à la liste">‹</button>
    <h1>Conférence</h1>
  </header>
  <div id="conf-grille"></div>
  <div id="conf-fil" aria-live="polite"></div>
  <form id="conf-saisie">
    <input id="conf-message" autocomplete="off" placeholder="Sur quoi veux-tu discuter ?" aria-label="Message">
    <button class="micro" id="conf-micro" type="button" aria-label="Dicter un message" aria-pressed="false">🎤</button>
    <button class="bouton" id="conf-envoyer" type="submit">Envoyer</button>
  </form>
  <div class="pied bas">
    <button class="bouton second" id="conf-reagir" type="button" disabled>Faire réagir les autres</button>
    <button class="bouton second" id="conf-terminer" type="button">Terminer</button>
  </div>
</section>

<section id="ecran-fiche" class="ecran">
  <header><h1>Fiche</h1></header>
  <div class="corps">
    <div class="rang">
      <div id="f-photo" class="pastille grande"></div>
      <button class="bouton second" id="f-choisir" type="button">Choisir une photo</button>
      <button class="bouton second" id="f-creer" type="button">Créer un portrait</button>
      <input id="f-fichier" type="file" accept="image/*" hidden>
    </div>
    <div class="msg" id="f-msg" role="status"></div>
    <div class="portrait-panel" id="f-portrait" hidden>
      <label>Description du portrait<textarea id="f-portrait-desc" rows="3" maxlength="450"></textarea></label>
      <div class="msg" id="f-portrait-compte" aria-live="off">0 / 450</div>
      <img class="apercu" id="f-portrait-img" alt="Aperçu du portrait" hidden>
      <div class="msg" id="f-portrait-msg" role="status"></div>
      <div class="rang">
        <button class="bouton" id="f-portrait-gen" type="button">Générer</button>
        <button class="bouton" id="f-portrait-garder" type="button" hidden>Garder</button>
        <button class="bouton second" id="f-portrait-refaire" type="button" hidden>Recommencer</button>
        <button class="bouton second" id="f-portrait-fermer" type="button">Fermer</button>
      </div>
    </div>
    <label>Nom<input id="f-nom"></label>
    <label>Rôle<input id="f-lien"></label>
    <label>Fiche (texte libre)<textarea id="f-fiche"></textarea></label>
    <label>Voix<select id="f-voix"></select></label>
    <label>Description de la voix<input id="f-voix-desc" placeholder="ex. posée, un peu rieuse"></label>
    <h2 id="f-titre-souvenirs"></h2>
    <ul id="souvenirs"></ul>
    <button class="bouton second" id="f-annuler-mem" type="button" hidden>Annuler la dernière mise à jour</button>
    <button class="bouton second danger" id="f-supprimer" type="button">Supprimer ce coach</button>
  </div>
  <div class="pied">
    <button class="bouton second" id="fiche-annuler" type="button">Annuler</button>
    <button class="bouton" id="fiche-ok" type="button">Enregistrer</button>
  </div>
</section>

<section id="ecran-reglages" class="ecran">
  <header><h1>Réglages</h1></header>
  <div class="corps">
    <div class="avert" id="r-gratuite">Clé gratuite : Google peut lire tes échanges.</div>
    <label class="case"><input type="checkbox" id="r-payante"> J'utilise une clé payante</label>
    <label>Clé Gemini<input id="r-cle" type="password" autocomplete="off"></label>
    <h2>Service portraits</h2>
    <label>Adresse du service<input id="r-portrait-url" type="url" autocomplete="off" inputmode="url"></label>
    <label>Mot de passe du service<input id="r-portrait-mdp" type="password" autocomplete="off"></label>
    <label>Ton prénom<input id="r-prenom"></label>
    <label>Ce que tous savent<textarea id="r-commun" rows="8"></textarea></label>
    <h2>Coachs</h2>
    <div class="avert" id="r-rappel" hidden>Pense à sauvegarder tes coachs (Exporter).</div>
    <div class="rang">
      <button class="bouton second" id="exporter" type="button">Exporter</button>
      <button class="bouton second" id="importer" type="button">Importer</button>
      <input id="fichier" type="file" accept=".json,application/json,text/plain" hidden>
    </div>
    <div class="msg" id="r-msg" role="status"></div>
    <button class="bouton second" id="effacer" type="button">Effacer les conversations</button>
  </div>
  <div class="pied">
    <button class="bouton second" id="reglages-annuler" type="button">Annuler</button>
    <button class="bouton" id="reglages-ok" type="button">Enregistrer</button>
  </div>
</section>

<div id="visionneuse" hidden>
  <img id="visio-img" alt="">
  <button id="visio-fermer" type="button" aria-label="Fermer">×</button>
</div>

<div id="alerte" class="avert" role="alert" hidden></div>

<script type="module" src="app.js"></script>
<script>
// Si le démarrage n'a pas abouti après 10 s (fichiers de deux versions mélangés), on le dit au lieu de rester sur « Chargement… ».
setTimeout(() => {
  const t = document.getElementById("chargement-texte");
  if (!window.avatarPret && t && t.textContent.startsWith("Chargement")) t.textContent = "Mise à jour incomplète : ferme puis rouvre l'appli";
}, 10000);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
